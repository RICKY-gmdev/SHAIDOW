<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gptGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="gptGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#gptGradient)" filter="url(#gptGlow)"/>
  
  <!-- GPT letters -->
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">GPT</text>
  
  <!-- Decorative elements -->
  <circle cx="18" cy="18" r="2" fill="white" opacity="0.6"/>
  <circle cx="46" cy="18" r="2" fill="white" opacity="0.6"/>
  <circle cx="18" cy="46" r="2" fill="white" opacity="0.6"/>
  <circle cx="46" cy="46" r="2" fill="white" opacity="0.6"/>
</svg>