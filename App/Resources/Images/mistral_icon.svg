<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mistralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#mistralGradient)" filter="url(#glow)"/>
  
  <!-- M letter -->
  <path d="M20 20 L20 44 L26 44 L26 30 L32 40 L38 30 L38 44 L44 44 L44 20 L36 20 L32 28 L28 20 Z" 
        fill="white" 
        stroke="white" 
        stroke-width="1"/>
  
  <!-- Decorative elements -->
  <circle cx="16" cy="16" r="2" fill="white" opacity="0.6"/>
  <circle cx="48" cy="16" r="2" fill="white" opacity="0.6"/>
  <circle cx="16" cy="48" r="2" fill="white" opacity="0.6"/>
  <circle cx="48" cy="48" r="2" fill="white" opacity="0.6"/>
</svg>